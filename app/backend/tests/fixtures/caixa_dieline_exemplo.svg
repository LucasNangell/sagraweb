<?xml version="1.0" encoding="UTF-8"?>
<!-- Faca: camada corte #ED3237, camada dobras #00AFEF; linhas nomeadas + cantos curvos. -->
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
     width="280mm" height="200mm" viewBox="0 0 280 200">
  <g id="corte" inkscape:label="corte" inkscape:groupmode="layer"
     fill="none" stroke="#ED3237" stroke-width="0.5">
    <!-- Contorno com cantos arredondados (A) e cubics (C) como na faca real -->
    <path id="corte_perimetro" d="
      M 18 40
      L 70 40 L 70 24
      C 70 16 76 10 84 10
      L 96 10
      C 104 10 110 16 110 24
      L 110 40 L 130 40
      L 126 14
      A 8 8 0 0 1 134 6
      L 186 6
      A 8 8 0 0 1 194 14
      L 190 40 L 210 40 L 210 24
      C 210 16 216 10 224 10
      L 226 10
      C 234 10 240 16 240 24
      L 240 40 L 262 40
      L 262 160 L 240 160 L 240 176
      C 240 184 234 190 226 190
      L 224 190
      C 216 190 210 184 210 176
      L 210 160 L 190 160
      L 194 186
      A 8 8 0 0 1 186 194
      L 134 194
      A 8 8 0 0 1 126 186
      L 130 160 L 110 160 L 110 176
      C 110 184 104 190 96 190
      L 84 190
      C 76 190 70 184 70 176
      L 70 160 L 18 160
      Z"/>
  </g>

  <g id="dobras" inkscape:label="dobras" inkscape:groupmode="layer"
     fill="none" stroke="#00AFEF" stroke-width="0.45">
    <line id="dobra_v_glue" x1="30" y1="40" x2="30" y2="160"/>
    <line id="dobra_v_1" x1="90" y1="40" x2="90" y2="160"/>
    <line id="dobra_v_2" x1="130" y1="40" x2="130" y2="160"/>
    <line id="dobra_v_3" x1="190" y1="40" x2="190" y2="160"/>
    <line id="dobra_v_4" x1="230" y1="40" x2="230" y2="160"/>
    <line id="dobra_h_flap_a" x1="70" y1="40" x2="110" y2="40"/>
    <line id="dobra_h_flap_b" x1="130" y1="40" x2="190" y2="40"/>
    <line id="dobra_h_flap_c" x1="210" y1="40" x2="240" y2="40"/>
    <line id="dobra_h_flap_d" x1="70" y1="160" x2="110" y2="160"/>
    <line id="dobra_h_flap_e" x1="130" y1="160" x2="190" y2="160"/>
    <line id="dobra_h_flap_f" x1="210" y1="160" x2="240" y2="160"/>
  </g>
</svg>
