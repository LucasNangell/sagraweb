<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="70mm" height="50mm" viewBox="0 0 70 50">
  <!-- Vinco diagonal entre dois triângulos -->
  <g id="corte" stroke="#ED3237" fill="none" stroke-width="0.4">
    <path id="corte_perimetro" data-sagra="cut-outline"
