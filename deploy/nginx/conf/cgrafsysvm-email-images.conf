        # Imagens estaticas para corpo HTML de e-mails.
        # Pasta persistente (nao sobrescrita pelo deploy): shared/email_images/
        # URL: https://cgrafsysvm.camara.leg.br/email_images/<arquivo>
        # Copiar para \\cgrafsysvm\nginx\conf\cgrafsysvm-email-images.conf

        location = /email_images {
            return 301 /email_images/;
        }

        location ^~ /email_images/ {
            alias "C:/Sistemas CGraf/Sagra Web/shared/email_images/";
            autoindex off;
            expires 7d;
            add_header Cache-Control "public, max-age=604800" always;
        }
