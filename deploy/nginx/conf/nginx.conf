# Trecho SAGRA Web — bloco server :80 no cgrafsysvm (nginx.conf)
#   /              -> SPA React (Uvicorn :8050) — sem try_files em C:/SagraWeb
#   /sagra/api/    -> FastAPI (sem colisao com OBS em /api)
#   /api           -> OBS :4040
#
# No http { } (fora do server), incluir:
#   map $upstream_http_content_type $sagra_html_no_cache {
#       default "";
#       "~*text/html" "no-cache, no-store, must-revalidate";
#   }

    upstream sagra_backend {
        server 127.0.0.1:8050;
        keepalive 16;
    }

        location /sagra/api/ws {
            proxy_pass http://sagra_backend/api/ws;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # ZIP Gravação Externa — volumes grandes (até ~1h).
        # Após aplicar no servidor: deploy/nginx/recarregar-nginx.bat
        location ~ ^/sagra/api/gravacao-externa/.+/arquivos/download-all$ {
            rewrite ^/sagra/api/(.*)$ /api/$1 break;
            proxy_pass http://sagra_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header Connection "";
            proxy_request_buffering off;
            proxy_buffering off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        location /sagra/api/ {
            proxy_pass http://sagra_backend/api/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header Connection "";
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        location ~ ^/sagra/(?!api)(.*)$ {
            return 301 /$1$is_args$args;
        }

        location = /sagra {
            return 301 /$is_args$args;
        }

        # Legado: apenas painéis TV e configs
        location ~ ^/dashboard_(setor|global)\.(html|css|js)$ {
            root C:/SagraWeb;
            try_files $uri =404;
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        }

        location = /config_client.js {
            root C:/SagraWeb;
            try_files $uri =404;
        }

        location = /config_painel_global.json {
            root C:/SagraWeb;
            try_files $uri =404;
        }

        location / {
            proxy_pass http://sagra_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header Connection "";
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            add_header Cache-Control $sagra_html_no_cache always;
        }
