<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Arcade press — PRESS</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;background:#151a24;padding:15px;font-family:system-ui,sans-serif}

@property --angle{syntax:'\3c angle>';initial-value:0deg;inherits:false}
.press-button{--c:#8571ff;--c2:#f57cb7;--ink:#fff;--speed:300ms;position:relative;isolation:isolate;display:inline-flex;align-items:center;justify-content:center;gap:5px;max-width:100%;padding:13px 22px;border:0;border-radius:8px;background:var(--c);color:var(--ink);font:600 13px/1.25 Inter,ui-sans-serif,system-ui,sans-serif;text-decoration:none;white-space:nowrap;vertical-align:middle;cursor:pointer;user-select:none;touch-action:manipulation;transition:all var(--speed) ease;outline-offset:2px;-webkit-tap-highlight-color:transparent}
.press-button .label,.press-button .icon,.press-button .detail{position:relative;z-index:2;pointer-events:none}.press-button .icon{line-height:1;flex-shrink:0;font-family:ui-sans-serif,system-ui,sans-serif}.press-button .detail{font:10px ui-monospace,monospace;white-space:nowrap}.press-button .detail:empty{display:none}.press-button::before,.press-button::after{pointer-events:none}.press-button:focus-visible,.press-button.is-focus{outline:2px solid var(--c2)}.press-button:disabled{opacity:.45;cursor:not-allowed;filter:grayscale(.4);pointer-events:none}.press-button[data-busy=true]{opacity:.8;cursor:wait}.press-button[data-busy=true] .icon{animation:press-spin 1s linear infinite}.press-button[data-position=end] .icon{order:3}.press-button[data-position=only] .label{position:absolute!important;width:1px!important;height:1px!important;padding:0!important;overflow:hidden!important;clip:rect(0,0,0,0)!important;white-space:nowrap!important}.press-button[data-position=only] .detail{display:none}.press-button[data-done=true]{animation:press-pop .4s ease}.press-ripple{position:absolute!important;border-radius:50%;pointer-events:none;background:currentColor;opacity:.25;z-index:3;transform:translate(-50%,-50%) scale(0);animation:press-ripple .65s ease-out forwards}.press-particle{position:absolute;width:5px;height:7px;top:50%;left:50%;background:var(--particle);pointer-events:none;z-index:10;animation:press-confetti .85s ease-out forwards}.press-button.motion-off,.press-button.motion-off *,.press-button.motion-off::before,.press-button.motion-off::after,.motion-off .press-button,.motion-off .press-button *,.motion-off .press-button::before,.motion-off .press-button::after{animation:none!important;transition:none!important}.press-button.motion-off .press-ripple,.press-button.motion-off .press-particle,.motion-off .press-particle,.motion-off .press-ripple{display:none}
@keyframes press-gradient{0%,100%{background-position:0 50%}50%{background-position:100% 50%}}
@keyframes press-pulse{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--c) 35%,transparent)}50%{box-shadow:0 0 0 9px transparent}}
@keyframes press-flicker{0%,91%,96%{opacity:1}92%,95%{opacity:.3}}
@keyframes press-blink{50%{opacity:.2}}
@keyframes press-spin{to{rotate:360deg}}
@keyframes press-orbit{to{--angle:360deg}}
@keyframes press-run{to{left:110%}}
@keyframes press-scan{0%,100%{top:0}50%{top:100%}}
@keyframes press-border{0%,100%{border-color:var(--c);box-shadow:0 0 0 transparent}50%{border-color:var(--c2);box-shadow:0 0 18px color-mix(in srgb,var(--c2) 40%,transparent)}}
@keyframes press-dash{50%{outline-offset:7px}}
@keyframes press-morph{0%,100%{border-radius:43% 57% 65% 35% / 60% 42% 58% 40%}50%{border-radius:65% 35% 43% 57% / 42% 60% 40% 58%}}
@keyframes press-down{50%{translate:0 2px}}
@keyframes press-wiggle{0%,100%{rotate:0deg}25%{rotate:-5deg}75%{rotate:5deg}}
@keyframes press-bounce{0%,100%{translate:0 0}50%{translate:0 -7px}}
@keyframes press-pop{0%,100%{scale:1}45%{scale:1.12}}
@keyframes press-progress{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes press-glitch{0%,100%{translate:0;filter:none}25%{translate:-2px 1px;filter:drop-shadow(3px 0 var(--c2))}75%{translate:2px -1px;filter:drop-shadow(-3px 0 var(--c))}}
@keyframes press-float{0%,100%{translate:0 0}50%{translate:0 -6px}}
@keyframes press-ripple{to{transform:translate(-50%,-50%) scale(1);opacity:0}}
@keyframes press-confetti{to{transform:translate(var(--dx),var(--dy)) rotate(var(--dr));opacity:0}}
@keyframes press-shake{0%,100%{translate:0 0}25%{translate:-3px 0}75%{translate:3px 0}}
@media(prefers-reduced-motion:reduce){.press-button,.press-button *,.press-button::before,.press-button::after{animation:none!important;transition:none!important}.press-button .press-ripple,.press-button .press-particle{display:none}}

/* Modelo: Arcade press */
.press-button[data-model="depth-1"]{background:var(--c);border-radius:10px;box-shadow:0 3px 0 var(--c2),0 10px 15px #0003;text-shadow:0 0px #0003}.press-button[data-model="depth-1"]:is(:active,.is-active){translate:0 3px;box-shadow:0 0px 0 var(--c2)}
/* Personalização */
.press-button[data-model="depth-1"]{--c:#ff8b53;--c2:#bb4c25;--ink:#ffffff;--speed:100ms;transition-duration:100ms;--press:2px;}

</style>
</head>
<body>
<button type="button" class="press-button" data-model="depth-1" data-behavior="none" data-position="start" aria-label="Jogar agora" style="--c:#ff8b53;--c2:#bb4c25;--ink:#ffffff;"><span class="icon" aria-hidden="true">▶</span><span class="label">Jogar agora</span><span class="detail" aria-hidden="true"></span></button>
<script>
function initButton(el){
  const kind=el.dataset.behavior||'none';
  const label=el.querySelector('.label'),icon=el.querySelector('.icon'),detail=el.querySelector('.detail');
  const original=label.textContent,originalIcon=icon.textContent;
  let busy=false,count=0,holdTimer,resetTimer,armed=false,holding=false;
  const reduced=()=>el.classList.contains('motion-off')||!!el.closest('.motion-off')||window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const say=(text)=>{label.textContent=text;el.setAttribute('aria-label',text);};
  function reset(){busy=false;armed=false;el.disabled=false;el.removeAttribute('aria-busy');delete el.dataset.busy;delete el.dataset.done;delete el.dataset.armed;icon.textContent=originalIcon;say(original);detail.textContent='';}
  async function copyText(){try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(original);}else{const ta=document.createElement('textarea');ta.value=original;ta.style.cssText='position:fixed;left:-9999px';(el.closest('dialog')||document.body).append(ta);ta.select();const ok=document.execCommand('copy');ta.remove();el.focus();if(!ok)throw new Error('copy');}el.dataset.done='true';say('Copiado!');icon.textContent='✓';}catch{say('Cópia indisponível');}clearTimeout(resetTimer);resetTimer=setTimeout(reset,1500);}
  function burst(e){if(reduced())return;const box=el.getBoundingClientRect();if(kind==='ripple'){const s=document.createElement('span');s.className='press-ripple';const diameter=Math.max(box.width,box.height)*2.3;s.style.width=s.style.height=diameter+'px';s.style.left=(e.detail===0?box.width/2:e.clientX-box.left)+'px';s.style.top=(e.detail===0?box.height/2:e.clientY-box.top)+'px';el.append(s);setTimeout(()=>s.remove(),750);}else{for(let i=0;i<16;i++){const s=document.createElement('span');s.className='press-particle';const angle=i*Math.PI*2/16,r=35+Math.random()*45;s.style.setProperty('--dx',Math.cos(angle)*r+'px');s.style.setProperty('--dy',Math.sin(angle)*r-15+'px');s.style.setProperty('--dr',Math.random()*500+'deg');s.style.setProperty('--particle',['var(--c)','var(--c2)','#f8d76d','#ffffff'][i%4]);el.append(s);setTimeout(()=>s.remove(),950);}}}
  function startHold(){if(holding||el.dataset.done==='true'||el.disabled)return;holding=true;el.dataset.holding='true';detail.textContent='…';holdTimer=setTimeout(()=>{el.dataset.done='true';delete el.dataset.holding;holding=false;detail.textContent='✓';say('Confirmado');},1000);}
  function cancelHold(){clearTimeout(holdTimer);holding=false;delete el.dataset.holding;if(el.dataset.done!=='true')detail.textContent='';}
  if(['toggle','like'].includes(kind))el.setAttribute('aria-pressed','false');
  if(kind==='count')detail.textContent='0';
  if(kind==='hold'){
    el.addEventListener('pointerdown',e=>{if(e.button!==0)return;el.setPointerCapture(e.pointerId);startHold();});
    ['pointerup','pointercancel','lostpointercapture','blur'].forEach(type=>el.addEventListener(type,cancelHold));
    el.addEventListener('keydown',e=>{if(e.key===' '||e.key==='Enter'){e.preventDefault();if(!e.repeat)startHold();}});
    el.addEventListener('keyup',e=>{if(e.key===' '||e.key==='Enter'){e.preventDefault();cancelHold();}});
  }
  if(kind==='magnetic'||kind==='tilt'){
    el.addEventListener('pointermove',e=>{if(reduced()||e.pointerType==='touch'||el.disabled)return;const b=el.getBoundingClientRect();const x=(e.clientX-b.left)/b.width-.5,y=(e.clientY-b.top)/b.height-.5;el.style.setProperty('--mx',(x+.5)*100+'%');el.style.setProperty('--my',(y+.5)*100+'%');el.style.transform=kind==='magnetic'?`translate(${x*15}px,${y*13}px)`:`perspective(500px) rotateX(${-y*22}deg) rotateY(${x*25}deg)`;});
    el.addEventListener('pointerleave',()=>{el.style.transform='';});
  }
  el.addEventListener('click',e=>{
    if(busy||el.disabled)return;
    if(kind==='ripple'||kind==='confetti')burst(e);
    if(kind==='toggle'||kind==='like'){const on=el.getAttribute('aria-pressed')!=='true';el.setAttribute('aria-pressed',String(on));if(kind==='like'){say(on?'Curtido':original);icon.textContent=on?'♥':originalIcon;}else{detail.textContent=on?'ON':'OFF';el.setAttribute('aria-label',original+(on?' — ativado':' — desativado'));}}
    if(kind==='count'){count++;detail.textContent=String(count);el.setAttribute('aria-label',original+' — '+count+' cliques');}
    if(kind==='loading'){busy=true;el.dataset.busy='true';el.setAttribute('aria-busy','true');el.disabled=true;icon.textContent='◌';say('Processando…');resetTimer=setTimeout(()=>{el.disabled=false;delete el.dataset.busy;el.removeAttribute('aria-busy');el.dataset.done='true';icon.textContent='✓';say('Concluído!');resetTimer=setTimeout(reset,1300);},1200);}
    if(kind==='copy')copyText();
    if(kind==='confirm'){if(el.dataset.done==='true')return;if(!armed){armed=true;el.dataset.armed='true';say('Confirmar?');detail.textContent='2×';resetTimer=setTimeout(reset,3000);}else{clearTimeout(resetTimer);armed=false;delete el.dataset.armed;el.dataset.done='true';say('Confirmado (demo)');icon.textContent='✓';detail.textContent='';resetTimer=setTimeout(reset,1600);}}
  });
  el.pressCleanup=()=>{clearTimeout(holdTimer);clearTimeout(resetTimer);};
}

document.querySelectorAll('.press-button').forEach(initButton);
</script>
</body>
</html>
